<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Добавлен viewport-fit=cover для полноэкранного режима на смартфонах с вырезом экрана -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kairos — Карманный наставник и трекер осознанных привычек</title>
    <meta name="description" content="Авторское пространство для формирования привычек, управления энергией и личной эффективности в ритме Кайроса.">
    
    <!-- PWA & Настройки мобильного полноэкранного режима (iOS / Android) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B0D10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kairos">
    <!-- Иконки для вкладки и установки на экран iPhone / Android -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link id="apple-touch-icon-link" rel="apple-touch-icon" href="./icon.svg">
    <script>
        // Автогенератор PNG-иконки 180x180 специально для iPhone (iOS Safari)
        (function() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');

                // 1. Глубокий темный фон
                const bgGrad = ctx.createRadialGradient(90, 60, 10, 90, 90, 130);
                bgGrad.addColorStop(0, '#1C2029');
                bgGrad.addColorStop(1, '#0B0D10');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 180, 180);

                // 2. Тонкое базовое кольцо
                ctx.beginPath();
                ctx.arc(90, 90, 58, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
                ctx.lineWidth = 5;
                ctx.stroke();

                // 3. Золотая дуга Kairos
                const goldGrad = ctx.createLinearGradient(90, 32, 148, 90);
                goldGrad.addColorStop(0, '#F3E5AB');
                goldGrad.addColorStop(0.5, '#D4AF37');
                goldGrad.addColorStop(1, '#AA8222');

                ctx.beginPath();
                ctx.arc(90, 90, 58, -Math.PI / 2, 0);
                ctx.strokeStyle = goldGrad;
                ctx.lineWidth = 7.5;
                ctx.lineCap = 'round';
                ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
                ctx.shadowBlur = 8;
                ctx.stroke();

                // 4. Точка фокуса в центре
                ctx.beginPath();
                ctx.arc(90, 90, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#D4AF37';
                ctx.fill();

                // Подставляем готовый PNG для iPhone
                const link = document.getElementById('apple-touch-icon-link');
                if (link) link.href = canvas.toDataURL('image/png');
            } catch (e) {}
        })();
    </script>
    
    <!-- Расширенная типографика: добавлен курсив для цитат наставника и базовый 400 для читаемости -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Встроенные стили мгновенного экрана загрузки (пока компилируются React и Babel) -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B0D10;
            color: #F3F4F6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        .kairos-boot-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            background: radial-gradient(circle at 50% 35%, rgba(212, 175, 55, 0.08) 0%, rgba(11, 13, 16, 1) 70%);
        }
        .kairos-boot-emblem {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
            animation: kairosPulse 2.4s infinite ease-in-out;
        }
        .kairos-boot-emblem::after {
            content: "✧";
            color: #D4AF37;
            font-size: 22px;
        }
        .kairos-boot-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #D4AF37;
            margin: 0 0 10px 0;
        }
        .kairos-boot-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 18px;
            color: rgba(243, 244, 246, 0.65);
            max-width: 280px;
            line-height: 1.4;
            margin: 0;
        }
        @keyframes kairosPulse {
            0%, 100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.2); }
            50% { transform: scale(1.04); box-shadow: 0 0 24px 4px rgba(212, 175, 55, 0.15); }
        }
    </style>

    <!-- Основные стили приложения -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Подключаем React и Babel через прямые ссылки CDNJS без редиректов (для 100% работы в офлайне) -->
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
    <!-- Внутри root находится прелоадер, который React автоматически заменит при монтировании -->
    <div id="root">
        <div class="kairos-boot-screen">
            <div class="kairos-boot-emblem"></div>
            <h1 class="kairos-boot-title">Kairos</h1>
            <p class="kairos-boot-subtitle">Настраиваем фокус на благоприятный момент...</p>
        </div>
    </div>
    
    <!-- Вспомогательный скрипт: синтезатор живого звука (Web Audio API), тактильный отклик и PWA -->
    <script>
        window.kairosAudio = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            isEnabled: function() {
                return localStorage.getItem('kairos_sound') !== 'off';
            },
            play: function(type = 'tap') {
                if (!this.isEnabled()) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;

                    if (type === 'tap') {
                        // Мягкий бархатный микро-отклик при касании кнопок
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(320, now);
                        osc.frequency.exponentialRampToValueAtTime(140, now + 0.045);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.05);
                    } else if (type === 'success') {
                        // Благородное созвучие (эффект поющей чаши) при выполнении привычки
                        [528, 660].forEach((freq, idx) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            const start = now + idx * 0.07;
                            osc.frequency.setValueAtTime(freq, start);
                            gain.gain.setValueAtTime(0.001, start);
                            gain.gain.linearRampToValueAtTime(0.08, start + 0.02);
                            gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.65);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(start);
                            osc.stop(start + 0.7);
                        });
                    } else if (type === 'breath') {
                        // Спокойный глубокий тон для смены фазы дыхания (4-4-6)
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(432, now);
                        gain.gain.setValueAtTime(0.001, now);
                        gain.gain.linearRampToValueAtTime(0.05, now + 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.2);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 1.25);
                    }
                } catch (e) {}
            }
        };

        // Глобальная функция отклика: работает и на Android (вибрация), и на iPhone (живой звук)
        window.triggerHaptic = function(pattern = 35) {
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(pattern); } catch (e) {}
            }
            if (window.kairosAudio) {
                if (Array.isArray(pattern)) {
                    window.kairosAudio.play('success');
                } else {
                    window.kairosAudio.play('tap');
                }
            }
        };

        // Сохраняем событие установки PWA
        window.deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredInstallPrompt = e;
            window.dispatchEvent(new CustomEvent('kairos-pwa-ready'));
        });

        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>

    <!-- Подключаем наши скрипты -->
    <script src="themes.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
