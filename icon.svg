<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#1C2029" />
            <stop offset="100%" stop-color="#0B0D10" />
        </radialGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F3E5AB" />
            <stop offset="50%" stop-color="#D4AF37" />
            <stop offset="100%" stop-color="#AA8222" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Фон иконки (без прозрачности, чтобы iOS не заливал края белым) -->
    <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

    <!-- Внешнее тонкое кольцо -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="14" />

    <!-- Акцентная дуга Кайроса (благоприятный момент) -->
    <path d="M 256 88 A 168 168 0 0 1 424 256" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

    <!-- Центральное ядро фокуса -->
    <circle cx="256" cy="256" r="22" fill="url(#goldGrad)" />
</svg>
